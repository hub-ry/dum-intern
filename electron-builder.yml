appId: com.dumintern.companion
productName: Dum
artifactName: Dum-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!node_modules/tsx/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"
asar: true
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/claude
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0'
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extendInfo:
    LSUIElement: true
  # OpenSuperWhisper is bundled only on Apple Silicon; prepare-dictation.mjs creates this
  # directory on all platforms so electron-builder does not error when the filter matches nothing.
  extraResources:
    - from: build/extra-resources
      to: .
      filter:
        - "OpenSuperWhisper.app/**"
        - "OpenSuperWhisper-LICENSE.txt"
dmg:
  title: Dum
  sign: false
linux:
  target: dir
  icon: build/icon.png
  category: Development
publish: null
