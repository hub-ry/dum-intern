appId: com.dumintern.companion
productName: Dum
artifactName: Dum-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!node_modules/tsx/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"
asar: true
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/claude
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0'
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extendInfo:
    LSUIElement: true
    # The voice helper is a child process, so macOS attributes its microphone request to Dum and
    # shows this text; Electron's generic default would appear otherwise.
    NSMicrophoneUsageDescription: Dum records while you hold the voice shortcut and transcribes on this Mac. Nothing is sent until you press Send.
  # prepare-dictation.mjs builds the universal focus helper (dum-focus) on any Mac and the
  # bridge-mode OpenSuperWhisper only on Apple Silicon. It creates this directory on all
  # platforms so electron-builder does not error when the filter matches nothing.
  extraResources:
    - from: build/extra-resources
      to: .
      filter:
        - "dum-focus"
        - "OpenSuperWhisper.app/**"
        - "OpenSuperWhisper-LICENSE.txt"
        - "OpenSuperWhisper-THIRD-PARTY.txt"
dmg:
  title: Dum
  sign: false
publish: null
