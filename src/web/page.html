<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>your skill tree — dum intern</title>
    <link rel="stylesheet" href="/static/page.css" />
    <link rel="icon" type="image/png" href="/site/favicon.png" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="mark">▛▚▘</span> dum</div>
      <div class="summary" id="summary">loading your tree…</div>
    </header>
    <p class="private">This link is the key to your tree: anyone who has it can see and edit it. Keep it to yourself.</p>
    <nav class="picker" id="picker" aria-label="tracks"></nav>
    <main id="tracks"></main>
    <section id="off" class="off" hidden>
      <h2>Off the tracks</h2>
      <p class="hint">Libraries and one-off ideas you've unlocked.</p>
      <ul id="offlist"></ul>
    </section>
    <footer class="legend">
      <span class="chip built">built - AI writes it</span>
      <span class="chip recognized">recognized - AI may use it as a tool</span>
      <span class="chip open">open - add it, or take its course</span>
      <span class="chip locked">locked</span>
    </footer>
    <dialog id="confirm">
      <form method="dialog">
        <h3 id="confirm-title"></h3>
        <p id="confirm-body"></p>
        <div class="actions">
          <button value="cancel" class="ghost">Cancel</button>
          <button value="ok" id="confirm-ok">OK</button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/static/page.js"></script>
  </body>
</html>
