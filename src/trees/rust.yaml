# Rust, roughly in the order people meet it. Each skill names only what it builds on directly.
# printing includes fn main and println!.
lang: rust
skills:
  - printing
  - variables: [printing]
  - mutability: [variables]
  - arithmetic: [variables]
  - conditionals: [variables]
  - loops: [conditionals]
  - functions: [variables]
  - return values: [functions]
  - ownership: [variables, functions]
  - borrowing: [ownership]
  - strings: [borrowing]
  - vectors: [loops, mutability]
  - structs: [variables]
  - methods: [structs, functions]
  - enums: [structs]
  - match: [enums, conditionals]
  - option: [match]
  - result: [match]
  - error propagation: [result, return values]
  - recursion: [return values, conditionals]
  - closures: [functions]
  - iterators: [vectors, closures]
  - hashmaps: [vectors, option]
  - modules: [functions]
  - traits: [methods]
  - generics: [traits]
  - lifetimes: [borrowing]
  - box: [ownership, structs]
  - threads: [closures, ownership]
  - async await: [traits, closures]
