# The interview track: data structures and algorithms in C++, in the order interviews lean on them.
# It builds on the C++ basics track, so the first rung is there.
lang: c++
track: interview
skills:
  - arrays and strings: [vectors, strings]
  - hashing: [maps, arrays and strings]
  - two pointers: [arrays and strings]
  - sliding window: [two pointers, hashing]
  - stacks and queues: [vectors]
  - monotonic stack: [stacks and queues]
  - binary search: [arrays and strings]
  - linked lists: [pointers, classes]
  - trees: [recursion, pointers]
  - tree traversal: [trees]
  - binary search trees: [tree traversal, binary search]
  - heaps: [vectors, trees]
  - graphs: [vectors, maps]
  - bfs: [graphs, stacks and queues]
  - dfs: [graphs, recursion]
  - topological sort: [dfs]
  - backtracking: [recursion, vectors]
  - dynamic programming: [recursion, arrays and strings]
  - shortest paths: [bfs, heaps]
