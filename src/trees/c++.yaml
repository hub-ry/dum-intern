# C++, roughly in the order people meet it. Each skill names only what it builds on directly.
# printing includes the skeleton every C++ program needs: the include and main.
lang: c++
track: basics
skills:
  - printing
  - variables: [printing]
  - arithmetic: [variables]
  - input: [variables]
  - conditionals: [variables]
  - while loops: [conditionals]
  - for loops: [conditionals]
  - functions: [variables]
  - return values: [functions]
  - strings: [variables]
  - vectors: [for loops]
  - range-based for: [vectors]
  - references: [functions]
  - const correctness: [references]
  - recursion: [return values, conditionals]
  - maps: [vectors]
  - iterators: [vectors]
  - lambdas: [functions]
  - classes: [functions]
  - constructors: [classes]
  - operator overloading: [classes]
  - inheritance: [classes]
  - pointers: [variables, references]
  - new and delete: [pointers, classes]
  - virtual functions: [inheritance, pointers]
  - destructors: [constructors]
  - raii: [destructors]
  - smart pointers: [raii, pointers]
  - templates: [functions, classes]
  - move semantics: [references, raii]
