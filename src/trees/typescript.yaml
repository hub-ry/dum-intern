# TypeScript, roughly in the order people meet it. Each skill names only what it builds on directly.
lang: typescript
skills:
  - printing
  - variables: [printing]
  - type annotations: [variables]
  - arithmetic: [variables]
  - strings: [variables]
  - template literals: [strings]
  - conditionals: [variables]
  - loops: [conditionals]
  - arrays: [type annotations]
  - functions: [type annotations]
  - return values: [functions]
  - objects: [type annotations]
  - interfaces: [objects]
  - type aliases: [type annotations]
  - union types: [type aliases]
  - type narrowing: [union types, conditionals]
  - arrow functions: [return values]
  - array methods: [arrays, arrow functions]
  - destructuring: [arrays, objects]
  - exceptions: [functions]
  - modules: [functions]
  - recursion: [return values, conditionals]
  - closures: [return values]
  - classes: [interfaces, functions]
  - generics: [functions, interfaces]
  - enums: [type aliases]
  - promises: [functions]
  - async await: [promises]
  - utility types: [generics]
