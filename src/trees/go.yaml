# Go, roughly in the order people meet it. Each skill names only what it builds on directly.
# printing includes package main, the fmt import and func main.
lang: go
skills:
  - printing
  - variables: [printing]
  - arithmetic: [variables]
  - strings: [variables]
  - conditionals: [variables]
  - for loops: [conditionals]
  - functions: [variables]
  - return values: [functions]
  - multiple return values: [return values]
  - slices: [for loops]
  - range: [slices]
  - maps: [slices]
  - structs: [variables]
  - pointers: [structs, functions]
  - methods: [structs, functions]
  - errors: [multiple return values]
  - defer: [functions]
  - packages: [functions]
  - recursion: [return values, conditionals]
  - closures: [functions]
  - interfaces: [methods]
  - goroutines: [functions]
  - channels: [goroutines]
  - select: [channels]
  - mutexes: [goroutines, pointers]
  - generics: [interfaces]
