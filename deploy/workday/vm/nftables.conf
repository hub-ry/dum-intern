#!/usr/sbin/nft -f
# workday VM firewall (inside the VM; hub's own firewall is untouched). The worker runs as the
# unprivileged `worker` user, so a hijacked worker cannot lift these rules.
# Out: only hub's egress proxy (10.77.0.1:3128), LXD's DNS and DHCP. Everything else, including
# hub's other ports and the tailnet via hub, is dropped.
# In: only hub (10.77.0.1) to the worker API (8790) and noVNC (6080).
flush ruleset

table inet workday_guard {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip saddr 10.77.0.1 tcp dport { 6080, 8790 } accept
    udp sport 67 udp dport 68 accept
    icmp type { echo-request, destination-unreachable, time-exceeded } accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept
    ip daddr 10.77.0.1 tcp dport 3128 accept
    ip daddr 10.77.0.1 meta l4proto { tcp, udp } th dport 53 accept
    udp sport 68 udp dport 67 accept
    icmp type echo-request ip daddr 10.77.0.1 accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept
  }
}
