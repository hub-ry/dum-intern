# hub has no desktop login to unlock the keyring, so this unlocks (or first
# creates) the "login" keyring at start from a random key on disk. It exists
# for brightspace-mcp-server, which keeps the Purdue password and its session
# key in the Secret Service via secret-tool. Anyone who can read the key file
# as ryanhubbart can read the keyring; it adds no protection beyond file
# permissions. Started at boot via default.target.wants (linger is on).
[Unit]
Description=GNOME Keyring daemon (headless, unlocked from a key file)

[Service]
ExecStart=
ExecStart=/usr/bin/gnome-keyring-daemon --foreground --unlock --components=secrets --control-directory=%t/keyring
StandardInput=file:%h/.config/gnome-keyring-headless/unlock-key
